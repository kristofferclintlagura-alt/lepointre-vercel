backend:
  name: github
  repo: kristofferclintlagura-alt/lepointre-vercel
  branch: main
  client_id: Ov23li0JGrhXeyNWOw0a
  base_url: https://lepointre-vercel.vercel.app
media_folder: "assets/img"
public_folder: "assets/img"

collections:
  - name: "posts"
    label: "Articles"
    folder: "content/posts"
    slug: "{{slug}}"
    create: true
    fields:
      - { name: title, label: "Titre" }
      - { name: date, label: "Date (AAAA-MM)", required: false }
      - { name: body, label: "Contenu", widget: "markdown", hint: "Collez le texte et les images." }

  - name: "pages"
    label: "Pages"
    files:
      - name: about
        label: "À propos"
        file: "content/pages/about.md"
        fields:
          - { name: title, label: "Titre" }
          - { name: body, label: "Contenu", widget: "markdown" }
      - name: contact
        label: "Contact"
        file: "content/pages/contact.md"
        fields:
          - { name: title, label: "Titre" }
          - { name: body, label: "Contenu", widget: "markdown" }
      - name: shop
        label: "Boutique"
        file: "content/pages/shop.md"
        fields:
          - { name: title, label: "Titre" }
          - { name: body, label: "Contenu", widget: "markdown" }

  - name: "site"
    label: "Paramètres du site"
    files:
      - name: site
        label: "Parametres du site"
        file: "content/site.json"
        fields:
          - { name: artist, label: "Nom de l'artiste" }
          - { name: tagline, label: "Slogan" }
          - { name: hero_image, label: "Photo d'en-tête", required: false }
          - { name: accent, label: "Couleur d'accent", required: false }
          - name: featured
            label: "Articles mis en avant"
            widget: list
            required: false
            fields:
              - { name: slug, label: "Slug" }
