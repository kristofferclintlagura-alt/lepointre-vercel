backend:
  name: github
  repo: kristofferclintlagura-alt/lepointre-vercel
  branch: main
  # Create a GitHub OAuth App (free): GitHub → Settings → Developer settings →
  # OAuth Apps → New OAuth App. Homepage + Authorization callback URL BOTH =
  # https://lepointre-vercel.vercel.app/admin/  (use your real URL / custom domain)
  # Then paste the Client ID here:
  client_id: <YOUR_GITHUB_OAUTH_CLIENT_ID>
  base_url: https://lepointre-vercel.vercel.app
media_folder: "assets/img"
public_folder: "assets/img"
# Direct publish (simplest for a non-technical client). Change to
# editorial_workflow if you want a review/approve step before changes go live.

collections:
  - name: "posts"
    label: "Articles"
    folder: "content/posts"
    slug: "{{slug}}"
    create: true
    fields:
      - { name: title, label: "Titre" }
      - { name: date, label: "Date (AAAA-MM)", required: false }
      - { name: body, label: "Contenu", widget: "markdown", hint: "Collez le texte et les images. Les images déjà téléchargées restent." }
  - name: "pages"
    label: "Pages"
    files:
      - name: about
        label: "À propos"
        file: "content/pages/about.md"
        fields:
          - { name: title, label: "Titre" }
          - { name: body, label: "Contenu", widget: "markdown" }
      - name: contact
        label: "Contact"
        file: "content/pages/contact.md"
        fields:
          - { name: title, label: "Titre" }
          - { name: body, label: "Contenu", widget: "markdown" }
      - name: shop
        label: "Boutique"
        file: "content/pages/shop.md"
        fields:
          - { name: title, label: "Titre" }
          - { name: body, label: "Contenu", widget: "markdown" }
  - name: "site"
    label: "Paramètres du site"
    file: "content/site.json"
    fields:
      - { name: artist, label: "Nom de l'artiste" }
      - { name: tagline, label: "Slogan" }
      - { name: hero_image, label: "Photo d'en-tête (chemin)", required: false, hint: "ex: assets/img/hero.jpg" }
      - { name: accent, label: "Couleur d'accent (hex)", required: false }
      - name: featured
        label: "8 articles en page d'accueil"
        widget: "list"
        required: false
        field: { name: slug, label: "Slug de l'article" }
